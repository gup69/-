<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8">
    <title>Petroglyph AR - Clean Fire</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body, html {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        background-color: transparent; 
        overflow: hidden;
      }

      #blackOverlay {
        position: absolute; top: 0; left: 0; 
        width: 100%; height: 100%;
        background-color: #000;
        z-index: -1; opacity: 0;
        transition: opacity 0.8s ease-in-out;
        pointer-events: none;
      }

      body.ar-found #blackOverlay { opacity: 1; }

      #infoPanel {
        position: absolute; bottom: 10%; left: 50%;
        transform: translateX(-50%);
        width: 90%; max-width: 450px;
        background: rgba(15, 10, 5, 0.85); 
        border: 1px solid #ff5500; border-radius: 12px;
        padding: 16px; color: #ffaa00;
        font-family: 'Segoe UI', sans-serif; text-align: center;
        box-shadow: 0 0 20px rgba(255, 85, 0, 0.3);
        z-index: 1000;
        opacity: 0; pointer-events: none;
        transition: opacity 0.8s ease-in-out;
      }
      
      body.ar-found #infoPanel { opacity: 1; pointer-events: auto; }
      #infoPanel h3 { margin: 0 0 8px 0; font-size: 1.3rem; text-shadow: 0 0 8px #ff5500; color: #fff; }
      #infoPanel p { margin: 0; font-size: 0.95rem; line-height: 1.5; color: #ffddaa; }
    </style>
  </head>
  <body>
    <div id="blackOverlay"></div>
    <div id="infoPanel">
      <h3>Всадник (Эпоха бронзы)</h3>
      <p>Древний петроглиф, выбитый на скале. Символизирует связь воина солярного культа и его коня.</p>
    </div>

    <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: no; uiLoading: no;" 
             color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Картинка загружается с crossorigin для обработки скриптом -->
        <img id="neonPetroglyph" src="glow.png" crossorigin="anonymous" />
        <video id="fireVideo" src="fire.mp4" loop muted playsinline crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        
        <!-- Огонь на заднем плане -->
        <a-video src="#fireVideo" 
                 position="0 0 -0.03" 
                 scale="1.15 1.15 1.15"
                 material="transparent: true; blending: additive; opacity: 0.85;">
        </a-video>

        <!-- Петроглиф на переднем плане -->
        <a-image id="petroImage" 
                 src="#neonPetroglyph" 
                 position="0 0 0" 
                 height="1" 
                 width="1" 
                 material="transparent: true; blending: additive; opacity: 1;">
        </a-image>

      </a-entity>
    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const target = document.querySelector('#target');
        const body = document.body;
        const fireVid = document.querySelector('#fireVideo');
        const imgElement = document.querySelector('#neonPetroglyph');

        fireVid.load();

        // АВТОМАТИЧЕСКОЕ УДАЛЕНИЕ ЧЕРНОГО ФОНА С КАРТИНКИ
        function removeBlackBackground() {
          const canvas = document.createElement('canvas');
          canvas.width = imgElement.naturalWidth || 512;
          canvas.height = imgElement.naturalHeight || 512;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(imgElement, 0, 0);
          
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imgData.data;
          
          for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], b = data[i+2];
            // Если пиксель темный/черный (фон), делаем его полностью прозрачным
            if (r < 30 && g < 30 && b < 30) {
              data[i+3] = 0; 
            }
          }
          ctx.putImageData(imgData, 0, 0);
          imgElement.src = canvas.toDataURL('image/png');
        }

        if (imgElement.complete) {
          removeBlackBackground();
        } else {
          imgElement.onload = removeBlackBackground;
        }

        target.addEventListener("targetFound", () => {
          body.classList.add('ar-found');
          fireVid.play();
        });

        target.addEventListener("targetLost", () => {
          body.classList.remove('ar-found');
          fireVid.pause();
        });
      });
    </script>
  </body>
</html>
