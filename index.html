<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8">
    <title>Petroglyph AR - Smart Scanner</title>
    
    <!-- Подключаем A-Frame и MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        /* Базовый фон всегда черный, но изначально он скрыт за видео с камеры */
        background-color: #000; 
        overflow: hidden;
      }
      
      /* Настраиваем плавный переход для элемента video, который генерирует AR-движок */
      video {
        transition: opacity 0.8s ease-in-out; 
      }

      /* 
         Магия здесь: когда JavaScript добавит класс 'ar-found' к тегу <body>,
         камера плавно растворится, оставив черный фон и AR-сцену
      */
      body.ar-found video {
        opacity: 0 !important;
      }

      /* Информационная панель */
      #infoPanel {
        position: absolute;
        bottom: 10%;
        left: 50%;
        transform: translateX(-50%);
        width: 80%;
        max-width: 400px;
        background: rgba(0, 0, 0, 0.85);
        border: 1px solid #00f0ff;
        border-radius: 12px;
        padding: 16px;
        color: #00f0ff;
        font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
        text-align: center;
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        z-index: 1000;
        
        /* Панель изначально прозрачна и не перехватывает клики */
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.8s ease-in-out;
      }
      
      /* Когда рисунок найден, плавно проявляем текст */
      body.ar-found #infoPanel {
        opacity: 1;
        pointer-events: auto;
      }

      #infoPanel h3 {
        margin: 0 0 8px 0;
        font-size: 1.3rem;
        text-shadow: 0 0 8px #00f0ff;
        letter-spacing: 1px;
      }
      
      #infoPanel p {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.5;
        color: #e0ffff;
      }
    </style>
  </head>
  <body>
    
    <!-- Текстовая панель (вставьте сюда вашу информацию) -->
    <div id="infoPanel">
      <h3>Всадник (Эпоха бронзы)</h3>
      <p>Древний петроглиф, изображающий конного воина с луком. Найден в ущелье. Возраст около 3000 лет.</p>
    </div>

    <!-- Настройка AR-сцены -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="neonPetroglyph" src="./glow.png" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <!-- 
          Изображение неонового контура. 
          Появляется точно поверх реального рисунка на скале
        -->
        <a-image src="#neonPetroglyph" 
                 position="0 0 0" 
                 height="1" 
                 width="1" 
                 material="transparent: true; blending: additive; opacity: 1;">
        </a-image>
      </a-entity>
    </a-scene>

    <!-- Скрипт логики переключения -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const target = document.querySelector('#target');
        const body = document.body;

        // Как только алгоритм распознает опорные точки маркера:
        target.addEventListener("targetFound", () => {
          // Добавляем класс, запускающий CSS-анимацию затемнения камеры и показа текста
          body.classList.add('ar-found');
        });

        // Если отвести телефон от рисунка:
        target.addEventListener("targetLost", () => {
          // Убираем класс — камера снова плавно появляется
          body.classList.remove('ar-found');
        });
      });
    </script>
  </body>
</html>
