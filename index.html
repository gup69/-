<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8">
    <title>Petroglyph AR - Fire Scanner</title>
    
    <!-- Подключаем A-Frame и MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: transparent; 
        overflow: hidden;
      }

      /* Слой для плавного затемнения реального мира */
      #blackOverlay {
        position: absolute;
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100%;
        background-color: #000;
        z-index: -1; 
        opacity: 0;
        transition: opacity 0.8s ease-in-out;
        pointer-events: none;
      }

      body.ar-found #blackOverlay {
        opacity: 1;
      }

      /* Информационная панель */
      #infoPanel {
        position: absolute;
        bottom: 10%;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 450px;
        background: rgba(15, 10, 5, 0.85); /* Слегка теплый оттенок фона под огонь */
        border: 1px solid #ff5500;
        border-radius: 12px;
        padding: 16px;
        color: #ffaa00;
        font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
        text-align: center;
        box-shadow: 0 0 20px rgba(255, 85, 0, 0.3);
        z-index: 1000;
        
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.8s ease-in-out;
      }
      
      body.ar-found #infoPanel {
        opacity: 1;
        pointer-events: auto;
      }

      #infoPanel h3 {
        margin: 0 0 8px 0;
        font-size: 1.3rem;
        text-shadow: 0 0 8px #ff5500;
        letter-spacing: 1px;
        color: #fff;
      }
      
      #infoPanel p {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.5;
        color: #ffddaa;
      }
    </style>
  </head>
  <body>
    
    <!-- Затемняющий экран -->
    <div id="blackOverlay"></div>

    <!-- Текстовая панель (цвета интерфейса изменены под огненный стиль) -->
    <div id="infoPanel">
      <h3>Всадник (Эпоха бронзы)</h3>
      <p>Древний петроглиф, выбитый на скале. Возраст около 3000 лет. Символизирует связь воина солярного культа и его коня.</p>
    </div>

    <!-- AR-сцена (без квадратов загрузки и сканирования) -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: no; uiLoading: no;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="neonPetroglyph" src="glow.png" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        
        <!-- 
          Изображение с эффектом горения:
          1. color="#ff5500" - окрашивает картинку в огненно-оранжевый.
          2. animation__flicker - заставляет яркость скакать как у пламени.
          3. animation__scale - создает микропульсацию контура.
        -->
        <a-image src="#neonPetroglyph" 
                 position="0 0 0" 
                 height="1" 
                 width="1" 
                 color="#ff5500"
                 material="transparent: true; blending: additive;"
                 animation__flicker="property: opacity; from: 0.3; to: 1; dur: 180; dir: alternate; loop: true; easing: easeInOutSine"
                 animation__pulse="property: scale; from: 0.98 0.98 0.98; to: 1.03 1.03 1.03; dur: 600; dir: alternate; loop: true; easing: easeInOutSine">
        </a-image>

      </a-entity>
    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const target = document.querySelector('#target');
        const body = document.body;

        target.addEventListener("targetFound", () => {
          body.classList.add('ar-found');
        });

        target.addEventListener("targetLost", () => {
          body.classList.remove('ar-found');
        });
      });
    </script>
  </body>
</html>
